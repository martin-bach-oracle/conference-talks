# -------------------------------------------------------------------- Folder structure

- name: Create all necessary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: oracle
    group: oinstall
    mode: "0755"
  loop:
    - "/home/oracle/autoupgrade/logs"
    - "/home/oracle/autoupgrade/bin"
    - "/home/oracle/autoupgrade/patches"
    - "/home/oracle/autoupgrade/conf"
    - "{{ oracle_home }}"
    - "{{ oracle_inventory }}"
    - "/u01/oradata"
    - "/u01/fast_recovery_area"

# -------------------------------------------------------------------- AutoUpgrade

- name: Download and run AutoUpgrade as oracle
  become: true
  become_user: oracle
  block:
    - name: Download AutoUpgrade metadata
      ansible.builtin.get_url:
        url: https://download.oracle.com/otn-pub/otn_software/autoupgrade.json
        dest: /home/oracle/autoupgrade/autoupgrade.json
        mode: '0644'

    - name: Read AutoUpgrade metadata
      ansible.builtin.slurp:
        src: /home/oracle/autoupgrade/autoupgrade.json
      register: autoupgrade_metadata_file

    - name: Parse AutoUpgrade metadata
      ansible.builtin.set_fact:
        autoupgrade_metadata: "{{ autoupgrade_metadata_file.content | b64decode | from_json }}"

    - name: Validate AutoUpgrade metadata
      ansible.builtin.assert:
        that:
          - autoupgrade_metadata.version | string is match('^[0-9]+(\.[0-9]+)*$')
          - autoupgrade_metadata.downloadUrl is match('^https://')
          - autoupgrade_metadata.checksum is match('^[0-9a-fA-F]{64}$')

    - name: Download and verify AutoUpgrade JAR
      # this is perhaps acceptable because the file is so small. Larger files should
      # be treated differently: validate if the file exists, proceeding with the
      # download only if the file is NOT present
      ansible.builtin.get_url:
        url: "{{ autoupgrade_metadata.downloadUrl }}"
        dest: "/home/oracle/autoupgrade/bin/autoupgrade.jar"
        checksum: "sha256:{{ autoupgrade_metadata.checksum }}"
        mode: '0644'

    - name: Deploy AutoUpgrade configuration file
      ansible.builtin.template:
        src: "templates/install-home.j2"
        dest: "/home/oracle/autoupgrade/conf/install-home.cfg"
        mode: "0644"
        owner: oracle
        group: oinstall

    - name: Run AutoUpgrade's create home command
      ansible.builtin.shell:
        cmd: |
          java -jar /home/oracle/autoupgrade/bin/autoupgrade.jar -config /home/oracle/autoupgrade/conf/install-home.cfg -mode create_home -noconsole
      register: au_state
      args:
        creates: "{{ oracle_home }}/root.sh"
      failed_when: au_state.rc not in [0, 6]

- name: Run root.sh
  ansible.builtin.command:
    cmd: "{{ oracle_home }}/root.sh"
  register: root_sh_state
  changed_when: root_sh_state.rc != 0

- name: Run orainstRoot.sh
  ansible.builtin.command:
    cmd: "{{ oracle_inventory }}/orainstRoot.sh"
  register: orainst_state
  changed_when: orainst_state.rc != 0

- name: Run dbca to create a database # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: |
      ${ORACLE_HOME}/bin/dbca -silent \
      -createDatabase \
      -templateName General_Purpose.dbc \
      -gdbName ORCL \
      -createAsContainerDatabase true \
      -redoLogFileSize 250 \
      -totalMemory 8192 \
      -recoveryAreaDestination /u01/fast_recovery_area \
      -datafileDestination /u01/oradata \
      -useLocalUndoForPDBs true \
      -useOMF true \
      -sysPassword {{ dba_password }} \
      -systemPassword {{ dba_password }}
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
  become: true
  become_user: oracle
  args:
    creates: "{{ oracle_base }}/cfgtoollogs/dbca/ORCL/ORCL.log"

- name: Mark the new database to be started when the system boots
  ansible.builtin.lineinfile:
    path: /etc/oratab
    regexp: '^ORCL'
    line: "ORCL:{{ oracle_home }}:Y"

- name: Deploy the script to create PDB1
  ansible.builtin.template:
    src: "templates/pdb1.j2"
    dest: "/home/oracle/pdb1.sql"
    mode: "0644"

- name: Add a PDB to the container database using the previously deployed script
  ansible.builtin.shell:
    cmd: ${ORACLE_HOME}/bin/sqlplus / as sysdba @/home/oracle/pdb1.sql
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_SID: ORCL
  register: pdb_creation_out
  become: true
  become_user: oracle
  changed_when: "'successfully created PDB1' in pdb_creation_out.stdout"

- name: Deploy the systemd unit file to start database and listener
  ansible.builtin.template:
    src: templates/oracle.service.j2
    dest: /etc/systemd/system/oracle.service
    owner: root
    group: root
    mode: '0644'

- name: Start the newly deployed service
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: oracle.service
    state: started
    enabled: true
